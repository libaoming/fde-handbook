<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="交付关键路径上，工程段之间插着非工程域段：备案、审批、合同、配额——它们不产生技术信号但占日历时间，必须画进关键路径并四字段登记">
<style>
  :root{ --paper:#ffffff; --ink:#17181a; --muted:#6b6f76; --faint:#b9b9b3; --danger:#a8321f; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131416; --ink:#e9eaec; --muted:#979ba2; --faint:#4a4d53; --danger:#e0785e; }
  }
  text{ font-family:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",system-ui,sans-serif }
  .bg{ fill:var(--paper) } .node{ fill:none; stroke:var(--ink); stroke-width:1.5 }
  .node-ghost{ stroke:var(--faint); stroke-dasharray:5 4 }
  .lbl{ fill:var(--ink); font-size:14px; font-weight:600 } .sub{ fill:var(--muted); font-size:11.5px }
  .edge{ stroke:var(--ink); stroke-width:1.6; fill:none }
  .edge-thick{ stroke:var(--ink); stroke-width:5; fill:none }
  .edge-ghost{ stroke:var(--faint); stroke-width:5; fill:none; stroke-dasharray:8 6 }
  .guide{ stroke:var(--faint); stroke-width:1; stroke-dasharray:3 4 }
  .etxt{ fill:var(--muted); font-size:12px } .etxt-ink{ fill:var(--ink); font-size:12px; font-weight:600 }
  .bad{ fill:var(--danger); font-size:12px; font-weight:600 }
  .lane{ fill:var(--muted); font-size:11px; letter-spacing:.18em }
</style>
<rect class="bg" width="1000" height="380"/>

<text class="lane" x="30" y="42">交付关键路径（横轴 = 日历时间）</text>

<!-- 路径：工程段实线粗，非工程段虚线粗 -->
<path class="edge-thick" d="M40,110 L240,110"/>
<path class="edge-ghost" d="M240,110 L430,110"/>
<path class="edge-thick" d="M430,110 L600,110"/>
<path class="edge-ghost" d="M600,110 L790,110"/>
<path class="edge-thick" d="M790,110 L960,110"/>

<text class="etxt-ink" x="90" y="92">工程：搭建</text>
<text class="etxt" x="255" y="92">⏳ 备案 / 合规（以周计）</text>
<text class="etxt-ink" x="465" y="92">工程：联调</text>
<text class="etxt" x="615" y="92">⏳ 账号 / 配额 / 盖章</text>
<text class="etxt-ink" x="835" y="92">工程：上线</text>

<text class="bad" x="250" y="146">这两段：无报错 · 无告警 · 不在任何监控里</text>

<!-- 六域 -->
<rect class="node node-ghost" x="30" y="180" width="145" height="50" rx="6"/><text class="lbl" x="44" y="202">备案与合规</text><text class="sub" x="44" y="220">法定周期，压不短</text>
<rect class="node node-ghost" x="190" y="180" width="145" height="50" rx="6"/><text class="lbl" x="204" y="202">账号与配额</text><text class="sub" x="204" y="220">有账号≠有该能力</text>
<rect class="node node-ghost" x="350" y="180" width="145" height="50" rx="6"/><text class="lbl" x="364" y="202">授权范围</text><text class="sub" x="364" y="220">以合同为准</text>
<rect class="node node-ghost" x="510" y="180" width="145" height="50" rx="6"/><text class="lbl" x="524" y="202">合同与计费</text><text class="sub" x="524" y="220">欠费停服无预告</text>
<rect class="node node-ghost" x="670" y="180" width="145" height="50" rx="6"/><text class="lbl" x="684" y="202">数据出域</text><text class="sub" x="684" y="220">IT 与法务分开问</text>
<rect class="node node-ghost" x="830" y="180" width="140" height="50" rx="6"/><text class="lbl" x="844" y="202">印章与流程</text><text class="sub" x="844" y="220">每道签字=日历时间</text>

<text class="etxt-ink" x="30" y="262">六域逐一过筛，命中项四字段登记：owner（人名）· 周期 · 完成凭证 · 阻塞哪些后续动作</text>

<line class="guide" x1="30" y1="286" x2="970" y2="286"/>
<text class="sub" x="30" y="314">等待纪律：① 不绕道——绕开审批的临时通道会活得比它解决的问题更久；② 有心跳——「在等」和</text>
<text class="sub" x="30" y="336">「没人管」的区别只有复查节奏那一行字。「大概率不涉及」的域按涉及处理，花五分钟问掉它。</text>
<text class="sub" x="30" y="358">问法用具体问题（备案到哪一步了？配额批了多少？），问「有没有问题」得到的永远是「没问题」。</text>
</svg>
