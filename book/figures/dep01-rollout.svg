<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="部署时间线：先打印影响清单并核对，再分批推进，批次之间隔至少一个下发周期的观测窗口，异常即停走演练过的回退；最后跑 VER-02 拿到 SWITCHED 才出关">
<style>
  :root{ --paper:#ffffff; --ink:#17181a; --muted:#6b6f76; --faint:#b9b9b3; --danger:#a8321f; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131416; --ink:#e9eaec; --muted:#979ba2; --faint:#4a4d53; --danger:#e0785e; }
  }
  text{ font-family:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",system-ui,sans-serif }
  .bg{ fill:var(--paper) } .node{ fill:none; stroke:var(--ink); stroke-width:1.5 }
  .node-key{ stroke-width:3 } .node-ghost{ stroke:var(--faint); stroke-dasharray:5 4 }
  .lbl{ fill:var(--ink); font-size:14px; font-weight:600 } .sub{ fill:var(--muted); font-size:11.5px }
  .edge{ stroke:var(--ink); stroke-width:1.6; fill:none }
  .edge-ghost{ stroke:var(--faint); stroke-width:1.4; fill:none; stroke-dasharray:6 5 }
  .guide{ stroke:var(--faint); stroke-width:1; stroke-dasharray:3 4 }
  .etxt{ fill:var(--muted); font-size:12px } .etxt-ink{ fill:var(--ink); font-size:12px; font-weight:600 }
  .bad{ fill:var(--danger); font-size:12px; font-weight:600 } .badstroke{ stroke:var(--danger); stroke-width:2; fill:none }
  .ah{ fill:var(--ink) } .ahg{ fill:var(--faint) }
</style>
<defs>
  <marker id="dp-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="dp-ghost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahg" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="1000" height="400"/>

<rect class="node" x="30" y="60" width="190" height="70" rx="6"/>
<text class="lbl" x="46" y="88">① 影响清单</text>
<text class="sub" x="46" y="110">工具打印实际会碰谁</text>
<text class="bad" x="46" y="146">有解释不了的条目 = 先解释再执行</text>

<rect class="node" x="290" y="60" width="130" height="70" rx="6"/>
<text class="lbl" x="306" y="88">批次 1</text>
<text class="sub" x="306" y="110">小半径</text>
<path class="edge" d="M220,95 L284,95" marker-end="url(#dp-ink)"/>

<rect class="node node-ghost" x="450" y="60" width="150" height="70" rx="6"/>
<text class="lbl" x="466" y="88">观测窗口</text>
<text class="sub" x="466" y="110">≥ 1 个下发周期</text>
<path class="edge" d="M420,95 L444,95" marker-end="url(#dp-ink)"/>

<rect class="node" x="630" y="60" width="130" height="70" rx="6"/>
<text class="lbl" x="646" y="88">批次 2…N</text>
<text class="sub" x="646" y="110">逐批扩大</text>
<path class="edge" d="M600,95 L624,95" marker-end="url(#dp-ink)"/>

<rect class="node node-key" x="820" y="60" width="150" height="70" rx="6"/>
<text class="lbl" x="836" y="88">VER-02 四项</text>
<text class="sub" x="836" y="110">SWITCHED 才出关</text>
<path class="edge" d="M760,95 L814,95" marker-end="url(#dp-ink)"/>

<!-- 异常即停 → 回退 -->
<rect class="node node-ghost" x="290" y="230" width="470" height="76" rx="6"/>
<text class="lbl" x="308" y="258">异常即停 → 回退（走演练过的那条路）</text>
<text class="sub" x="308" y="280">回退三问：写了吗 · 演过吗 · 演的覆盖本次路径吗——没演过的路径不计入可用能力</text>
<path class="edge-ghost" d="M355,130 L400,224" marker-end="url(#dp-ghost)"/>
<path class="edge-ghost" d="M525,130 L520,224" marker-end="url(#dp-ghost)"/>
<path class="edge-ghost" d="M695,130 L640,224" marker-end="url(#dp-ghost)"/>
<text class="etxt" x="770" y="270">回退也是一次切换：</text>
<text class="etxt" x="770" y="288">回退后重跑完整 VER-02</text>

<line class="guide" x1="30" y1="330" x2="970" y2="330"/>
<text class="sub" x="30" y="356">批次间不隔观测窗口的灰度 = 把全量发布拆成几次连续动作——风险原样，多了个安心的名字。</text>
<text class="sub" x="30" y="378">变更前另核一条：诊断通道与变更影响面无共享依赖（VER-01.1）——别让排障工具和故障一起沉没。</text>
</svg>
