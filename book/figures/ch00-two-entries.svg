<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="手册的两个入口：问「我在交付的哪一步」走主线，从 ROL-04 全景图按阶段进第 2 部对应节；问「我遇到了这个症状」走速查，从附录 A 症状索引每条指向正文节；两路都落到编号不漂移的正文具体节，第 3 部验证纪律不属于单一阶段、贯穿每个关口">
<style>
  :root{ --paper:#ffffff; --ink:#17181a; --muted:#6b6f76; --faint:#b9b9b3; --danger:#a8321f; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131416; --ink:#e9eaec; --muted:#979ba2; --faint:#4a4d53; --danger:#e0785e; }
  }
  text{ font-family:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",system-ui,sans-serif }
  .bg{ fill:var(--paper) } .node{ fill:none; stroke:var(--ink); stroke-width:1.5 }
  .node-key{ stroke-width:3 } .node-ghost{ stroke:var(--faint); stroke-dasharray:5 4 }
  .lbl{ fill:var(--ink); font-size:14px; font-weight:600 } .sub{ fill:var(--muted); font-size:11.5px }
  .edge{ stroke:var(--ink); stroke-width:1.6; fill:none }
  .edge-ghost{ stroke:var(--faint); stroke-width:1.4; fill:none; stroke-dasharray:6 5 }
  .guide{ stroke:var(--faint); stroke-width:1; stroke-dasharray:3 4 }
  .etxt{ fill:var(--muted); font-size:12px } .etxt-ink{ fill:var(--ink); font-size:12px; font-weight:600 }
  .ah{ fill:var(--ink) } .ahg{ fill:var(--faint) }
</style>
<defs>
  <marker id="c0-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="1000" height="400"/>

<!-- 主线入口 -->
<rect class="node" x="30" y="50" width="230" height="70" rx="6"/>
<text class="lbl" x="46" y="78">我在交付的哪一步？</text>
<text class="sub" x="46" y="100">该做什么 → 按阶段走主线</text>

<rect class="node node-key" x="330" y="50" width="200" height="70" rx="6"/>
<text class="lbl" x="346" y="78">ROL-04 全景图</text>
<text class="sub" x="346" y="100">头一次翻，读这节就够</text>

<rect class="node" x="600" y="50" width="210" height="70" rx="6"/>
<text class="lbl" x="616" y="78">第 2 部对应节</text>
<text class="sub" x="616" y="100">ENG·SUR·BLD·DEP·VER·HND</text>

<path class="edge" d="M260,85 L324,85" marker-end="url(#c0-ink)"/>
<text class="etxt-ink" x="266" y="75">① 主线</text>
<path class="edge" d="M530,85 L594,85" marker-end="url(#c0-ink)"/>
<text class="etxt" x="540" y="75">按阶段</text>
<path class="edge" d="M810,95 C835,102 842,124 872,146" marker-end="url(#c0-ink)"/>

<!-- 速查入口 -->
<rect class="node" x="30" y="250" width="230" height="70" rx="6"/>
<text class="lbl" x="46" y="278">我遇到了这个症状</text>
<text class="sub" x="46" y="300">去哪查 → 按症状走速查</text>

<rect class="node" x="330" y="250" width="200" height="70" rx="6"/>
<text class="lbl" x="346" y="278">附录 A · 症状索引</text>
<text class="sub" x="346" y="300">按故障域编号 · FX-SVC-01</text>

<path class="edge" d="M260,285 L324,285" marker-end="url(#c0-ink)"/>
<text class="etxt-ink" x="266" y="275">② 速查</text>
<path class="edge" d="M530,285 C640,285 760,260 824,210" marker-end="url(#c0-ink)"/>
<text class="etxt" x="600" y="262">每条指向正文节</text>

<!-- 汇合点 -->
<rect class="node" x="830" y="150" width="140" height="86" rx="6"/>
<text class="lbl" x="846" y="178">正文具体节</text>
<text class="sub" x="846" y="200">编号不漂移</text>
<text class="sub" x="846" y="218">供评审 · 工单引用</text>

<!-- 横切的第 3 部 -->
<line class="guide" x1="650" y1="158" x2="650" y2="122"/>
<line class="guide" x1="770" y1="158" x2="770" y2="122"/>
<rect class="node node-ghost" x="330" y="158" width="460" height="54" rx="6"/>
<text class="lbl" x="346" y="180">第 3 部 · 验证纪律（DIS）</text>
<text class="sub" x="346" y="200">不属于任何单一阶段，贯穿每个关口</text>

<line class="guide" x1="30" y1="330" x2="970" y2="330"/>
<text class="sub" x="30" y="354">第 1 部（ROL）先定义角色与交付物；检查项 / 速查条目的编号全书不漂移，供评审、工单、聊天直接引用。</text>
<text class="sub" x="30" y="376">贯穿全书的缺省：拿不准按更坏的情况处理 —— 没测＝未通过，没写＝没做，沉默＝未知。</text>
</svg>
