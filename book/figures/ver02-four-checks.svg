<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="VER-02 四项检查的判定流：四项依次通过才输出 SWITCHED；任何一项不通过输出 NOT_SWITCHED；任何一项没做或测不出输出 INDETERMINATE，按未通过处理">
<style>
  :root{ --paper:#ffffff; --ink:#17181a; --muted:#6b6f76; --faint:#b9b9b3; --danger:#a8321f; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131416; --ink:#e9eaec; --muted:#979ba2; --faint:#4a4d53; --danger:#e0785e; }
  }
  text{ font-family:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",system-ui,sans-serif }
  .bg{ fill:var(--paper) }
  .node{ fill:none; stroke:var(--ink); stroke-width:1.5 }
  .node-key{ stroke-width:3 }
  .node-ghost{ stroke:var(--faint); stroke-dasharray:5 4 }
  .lbl{ fill:var(--ink); font-size:14px; font-weight:600 }
  .sub{ fill:var(--muted); font-size:11.5px }
  .edge{ stroke:var(--ink); stroke-width:1.6; fill:none }
  .edge-ghost{ stroke:var(--faint); stroke-width:1.4; fill:none; stroke-dasharray:6 5 }
  .guide{ stroke:var(--faint); stroke-width:1; stroke-dasharray:3 4 }
  .etxt{ fill:var(--muted); font-size:12px }
  .etxt-ink{ fill:var(--ink); font-size:12px; font-weight:600 }
  .ah{ fill:var(--ink) } .ahg{ fill:var(--faint) }
</style>
<defs>
  <marker id="f-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="ah" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="f-ghost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="ahg" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="430"/>

<!-- 四项检查 -->
<rect class="node" x="30" y="60" width="200" height="72" rx="6"/>
<text class="lbl" x="46" y="88">服务在运行？</text>
<text class="sub" x="46" y="110">VER-02.1 · systemctl / kubectl</text>

<rect class="node" x="278" y="60" width="200" height="72" rx="6"/>
<text class="lbl" x="294" y="88">版本对得上？</text>
<text class="sub" x="294" y="110">VER-02.2 · 不可变标识逐字符</text>

<rect class="node" x="526" y="60" width="200" height="72" rx="6"/>
<text class="lbl" x="542" y="88">旧实例清干净？</text>
<text class="sub" x="542" y="110">VER-02.3 · 进程 · 副本 · LB 运行时表</text>

<rect class="node" x="774" y="60" width="200" height="72" rx="6"/>
<text class="lbl" x="790" y="88">真的干过活？</text>
<text class="sub" x="790" y="110">VER-02.4 · 唯一标识 grep 命中</text>

<!-- 是 → 链 -->
<path class="edge" d="M230,96 L272,96" marker-end="url(#f-ink)"/>
<text class="etxt-ink" x="240" y="86">是</text>
<path class="edge" d="M478,96 L520,96" marker-end="url(#f-ink)"/>
<text class="etxt-ink" x="488" y="86">是</text>
<path class="edge" d="M726,96 L768,96" marker-end="url(#f-ink)"/>
<text class="etxt-ink" x="736" y="86">是</text>

<!-- SWITCHED（主角） -->
<rect class="node node-key" x="784" y="208" width="180" height="60" rx="6"/>
<text class="lbl" x="802" y="234">SWITCHED</text>
<text class="sub" x="802" y="254">才可进入 VER-05 验收</text>
<path class="edge" d="M874,132 L874,202" marker-end="url(#f-ink)"/>
<text class="etxt-ink" x="882" y="172">四项全是</text>

<!-- NOT_SWITCHED 汇流条 -->
<rect class="node" x="30" y="208" width="620" height="60" rx="6"/>
<text class="lbl" x="48" y="234">NOT_SWITCHED</text>
<text class="sub" x="48" y="254">按未完成处理 · 修复后重跑全部四项（不是只补挂掉的那条）</text>

<path class="edge" d="M130,132 L130,202" marker-end="url(#f-ink)"/>
<text class="etxt" x="138" y="172">否</text>
<path class="edge" d="M378,132 L378,202" marker-end="url(#f-ink)"/>
<text class="etxt" x="386" y="172">否</text>
<path class="edge" d="M626,132 L626,202" marker-end="url(#f-ink)"/>
<text class="etxt" x="634" y="172">否</text>
<path class="edge" d="M800,132 C800,168 700,178 656,205" marker-end="url(#f-ink)"/>
<text class="etxt" x="742" y="172">否</text>

<!-- fail-closed 泳道 -->
<line class="guide" x1="30" y1="300" x2="970" y2="300"/>
<rect class="node node-ghost" x="30" y="322" width="620" height="60" rx="6"/>
<text class="lbl" x="48" y="348">INDETERMINATE_*</text>
<text class="sub" x="48" y="368">任一项没做或测不出（权限不足 · 日志缺失 · 未传参数）→ 一律按未通过处理</text>
<path class="edge-ghost" d="M340,270 L340,316" marker-end="url(#f-ghost)"/>
<text class="etxt" x="350" y="296">保守缺省 · fail-closed：「没测」≠「测了是好的」</text>
</svg>
