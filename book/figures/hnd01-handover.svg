<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="移交是能力转移的验收：分拣方法与客户资产，runbook 由客户的手演练成功，知识装进可 diff 可回滚可归因的载体，纠错通道有负责人，责任切换表签字">
<style>
  :root{ --paper:#ffffff; --ink:#17181a; --muted:#6b6f76; --faint:#b9b9b3; --danger:#a8321f; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131416; --ink:#e9eaec; --muted:#979ba2; --faint:#4a4d53; --danger:#e0785e; }
  }
  text{ font-family:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",system-ui,sans-serif }
  .bg{ fill:var(--paper) } .node{ fill:none; stroke:var(--ink); stroke-width:1.5 }
  .node-key{ stroke-width:3 } .node-ghost{ stroke:var(--faint); stroke-dasharray:5 4 }
  .lbl{ fill:var(--ink); font-size:14px; font-weight:600 } .sub{ fill:var(--muted); font-size:11.5px }
  .edge{ stroke:var(--ink); stroke-width:1.6; fill:none }
  .guide{ stroke:var(--faint); stroke-width:1; stroke-dasharray:3 4 }
  .etxt{ fill:var(--muted); font-size:12px } .etxt-ink{ fill:var(--ink); font-size:12px; font-weight:600 }
  .lane{ fill:var(--muted); font-size:11px; letter-spacing:.18em }
  .ah{ fill:var(--ink) }
</style>
<defs><marker id="hd-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="1000" height="400"/>

<text class="lane" x="30" y="40">交付方 → 客户：判据全部是「对方独立做到了什么」</text>

<rect class="node" x="30" y="60" width="215" height="76" rx="6"/>
<text class="lbl" x="46" y="88">① 分拣</text>
<text class="sub" x="46" y="110">方法类归你 · 客户资产类归客户</text>
<text class="sub" x="46" y="128">争议项当场按合同补议</text>

<rect class="node node-key" x="275" y="60" width="230" height="76" rx="6"/>
<text class="lbl" x="291" y="88">② runbook 演练</text>
<text class="sub" x="291" y="110">客户的手执行全程，你不碰键盘</text>
<text class="sub" x="291" y="128">你忍不住补的话 = 文档缺的行</text>
<path class="edge" d="M245,98 L269,98" marker-end="url(#hd-ink)"/>

<rect class="node" x="535" y="60" width="210" height="76" rx="6"/>
<text class="lbl" x="551" y="88">③ 知识载体三性</text>
<text class="sub" x="551" y="110">可 diff · 可回滚 · 可归因</text>
<text class="sub" x="551" y="128">底线：有版本历史，拒绝群聊</text>
<path class="edge" d="M505,98 L529,98" marker-end="url(#hd-ink)"/>

<rect class="node" x="775" y="60" width="195" height="76" rx="6"/>
<text class="lbl" x="791" y="88">④ 纠错通道</text>
<text class="sub" x="791" y="110">一个口径负责人，非委员会</text>
<text class="sub" x="791" y="128">改动过其手并留记录</text>
<path class="edge" d="M745,98 L769,98" marker-end="url(#hd-ink)"/>

<rect class="node" x="275" y="210" width="470" height="76" rx="6"/>
<text class="lbl" x="293" y="238">⑤ 责任切换表 + 支持窗口（双方签字）</text>
<text class="sub" x="293" y="260">切换日 · 每类事件第一响应人（人名）· 支持期限与超期收费 · 遗留清单</text>
<path class="edge" d="M510,136 L510,204" marker-end="url(#hd-ink)"/>

<line class="guide" x1="30" y1="322" x2="970" y2="322"/>
<text class="sub" x="30" y="348">「有问题随时找我」会腐蚀整个移交：客户永远不必真正接手，你的支持成本永远无法关账。</text>
<text class="sub" x="30" y="370">载体选型迁就对方真实能力——选一个对方不会用的完美载体，等于选择让知识回到群聊里去。</text>
<text class="sub" x="30" y="392">移交是全书最后一道关口：在这里放水，前面所有判定标量的严格都白费。</text>
</svg>
