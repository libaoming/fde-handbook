<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="验收日流程：四项前置全绿才开场，只对冻结判据表逐条执行并四字段留档，三态判定且测不出算不通过；不通过走回边重跑，全过签字归档，验收不等于移交">
<style>
  :root{ --paper:#ffffff; --ink:#17181a; --muted:#6b6f76; --faint:#b9b9b3; --danger:#a8321f; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131416; --ink:#e9eaec; --muted:#979ba2; --faint:#4a4d53; --danger:#e0785e; }
  }
  text{ font-family:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",system-ui,sans-serif }
  .bg{ fill:var(--paper) } .node{ fill:none; stroke:var(--ink); stroke-width:1.5 }
  .node-key{ stroke-width:3 } .node-ghost{ stroke:var(--faint); stroke-dasharray:5 4 }
  .lbl{ fill:var(--ink); font-size:14px; font-weight:600 } .sub{ fill:var(--muted); font-size:11.5px }
  .edge{ stroke:var(--ink); stroke-width:1.6; fill:none }
  .edge-ghost{ stroke:var(--faint); stroke-width:1.4; fill:none; stroke-dasharray:6 5 }
  .guide{ stroke:var(--faint); stroke-width:1; stroke-dasharray:3 4 }
  .etxt{ fill:var(--muted); font-size:12px } .etxt-ink{ fill:var(--ink); font-size:12px; font-weight:600 }
  .ah{ fill:var(--ink) } .ahg{ fill:var(--faint) }
</style>
<defs>
  <marker id="va-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="va-ghost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahg" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="1000" height="400"/>

<rect class="node" x="30" y="60" width="200" height="84" rx="6"/>
<text class="lbl" x="46" y="88">四项前置全绿</text>
<text class="sub" x="46" y="110">SWITCHED · 可达性 ·</text>
<text class="sub" x="46" y="128">EXECUTION_CONFIRMED · 判据表冻结</text>

<rect class="node" x="300" y="60" width="230" height="84" rx="6"/>
<text class="lbl" x="316" y="88">逐条执行 + 四字段留档</text>
<text class="sub" x="316" y="110">执行人（按归属，客户的客户跑）·</text>
<text class="sub" x="316" y="128">命令与输出原样粘贴 · 判定 · 时间环境</text>
<path class="edge" d="M230,102 L294,102" marker-end="url(#va-ink)"/>

<rect class="node" x="600" y="60" width="170" height="84" rx="6"/>
<text class="lbl" x="616" y="88">三态判定</text>
<text class="sub" x="616" y="110">通过 / 不通过 / 测不出</text>
<text class="sub" x="616" y="128">测不出 = 不通过</text>
<path class="edge" d="M530,102 L594,102" marker-end="url(#va-ink)"/>

<rect class="node node-key" x="830" y="60" width="140" height="84" rx="6"/>
<text class="lbl" x="846" y="88">签字归档</text>
<text class="sub" x="846" y="110">指定验收人签</text>
<text class="sub" x="846" y="128">证据链可复原</text>
<path class="edge" d="M770,102 L824,102" marker-end="url(#va-ink)"/>
<text class="etxt-ink" x="778" y="88">全过</text>

<rect class="node node-ghost" x="300" y="230" width="470" height="70" rx="6"/>
<text class="lbl" x="318" y="258">不通过 → 定位缺口回边（DEP / BLD / ENG-02 变更）</text>
<text class="sub" x="318" y="280">修复后重跑全部相关判据；无「暂计通过」——商务放行走变更，不是把红记成绿</text>
<path class="edge-ghost" d="M685,144 L640,224" marker-end="url(#va-ghost)"/>

<rect class="node node-ghost" x="30" y="230" width="230" height="70" rx="6"/>
<text class="lbl" x="46" y="258">临场新期望 → 登记变更</text>
<text class="sub" x="46" y="280">不进本次验收；加与删同罪</text>
<path class="edge-ghost" d="M380,144 L200,224" marker-end="url(#va-ghost)"/>

<line class="guide" x1="30" y1="330" x2="970" y2="330"/>
<text class="sub" x="30" y="356">验收 ≠ 移交：签收只结束「做没做完」；「客户能不能自己跑下去」另有 HND 判据，两者分开签。</text>
<text class="sub" x="30" y="378">归档判据：半年后没参与过项目的人，仅凭归档能回答「当时每条是怎么过的」。</text>
</svg>
